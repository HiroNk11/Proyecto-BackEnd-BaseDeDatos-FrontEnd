name: Calidad API y clientes
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  sql-server:
    runs-on: windows-2025
    env:
      COMERCIO_TEST_SQL_SERVER: '(localdb)\ComercioCI'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Start isolated SQL Server LocalDB instance
        shell: pwsh
        run: |
          $localDbExe = (Get-Command SqlLocalDB.exe -ErrorAction SilentlyContinue).Source
          if (-not $localDbExe) {
            $localDbExe = Get-ChildItem -Path "$env:ProgramFiles\Microsoft SQL Server\*\Tools\Binn\SqlLocalDB.exe" | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $localDbExe) { throw 'SQL Server LocalDB runtime is required.' }
          & $localDbExe create ComercioCI -s
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the CI LocalDB instance.' }
      - run: dotnet build ComercioPedidos/backend/ComercioPedidos.slnx --no-incremental -warnaserror
      - run: dotnet test ComercioPedidos/backend/ComercioPedidos.slnx --no-build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ComercioPedidos/backend/ComercioPedidos.slnx
      - run: dotnet build ComercioPedidos/backend/ComercioPedidos.slnx --no-restore --no-incremental -warnaserror
      - run: dotnet test ComercioPedidos/backend/ComercioPedidos.slnx --no-build
  clients:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [ComercioPedidos/frontend, comercio-pedidos-mobile]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run build
      - if: matrix.project == 'ComercioPedidos/frontend'
        run: npm test
      - run: npm run lint
